# Development compose for FlameCheck.
# Usage:
#   docker compose -f docker/docker-compose.dev-full.yaml up --build
#   docker compose -f docker/docker-compose.dev-full.yaml exec flamecheck bash

services:
  flamecheck:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: flamecheck
    image: flamecheck-dev:${DOCKER_IMAGE_TAG:-latest}
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=flamecheck.settings.development
      - FLAMECHECK_DB_HOST=postgres
      - FLAMECHECK_DB_PORT=5432
      - FLAMECHECK_DB_NAME=flamecheck
      - FLAMECHECK_DB_USER=flamecheck
      - FLAMECHECK_DB_PASSWORD=flamecheck
    volumes:
      - ..:/code
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: flamecheck-db
    environment:
      - POSTGRES_DB=flamecheck
      - POSTGRES_USER=flamecheck
      - POSTGRES_PASSWORD=flamecheck
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flamecheck"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
