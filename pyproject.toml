[build-system]
requires = ["uv_build>=0.10.0,<=0.12.0"]
build-backend = "uv_build"

[project]
name = "flamecheck"
version = "0.0.4"
description = "A qualitative analysis submission system for students in chemistry."
readme = "README.md"
license = { text = "GNU General Public License v3" }
authors = [
  { name = "mark doerr", email = "mark.doerr@uni-greifswald.de" },
]

maintainers = [
   {name = "mark doerr"},
]

requires-python = "==3.13.*"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]

# The default database backend is SQLite (no driver dependency required).
# PostgreSQL support is optional: install the "postgres" extra to pull in the
# driver, then point DATABASE_URL at a postgres:// URL (see .env-template).
dependencies = [
  "django>=6.1",
  "django-environ>=0.14",
  "django-allauth>=65.19",
  "argon2-cffi>=25.1.0",
  "django-filter>=26.1",
  "users",
  "substances",
  "analyses",
  "config",
  "multichoice",
  "django-ninja>=1.7",
  "django-cors-headers>=4.9",
  "whitenoise>=6.12",
  "PyJWT>=2.15",
  "gunicorn>=26.0",
]

[project.optional-dependencies]
postgres = [
  "psycopg>=3.3",
]

[project.urls]
"Bug Tracker" = "https://github.com/markdoerr//issues"
Changelog = "https://github.com/markdoerr//blob/main/CHANGELOG.md"
documentation = "https://.readthedocs.io"
repository = "https://github.com/markdoerr/"

[dependency-groups]
dev = [
  "coverage>=7.16",
  "pytest>=9,<10",
  "git-changelog>=2.10",
  "python-dotenv>=1.2",
  "pre-commit>=4.6",
  "python-semantic-release>=10.0",
  "ruff>=0.16",
  "pytest-cov>=7,<8",
  "pytest-django>=4.14",
  "factory-boy>=3.3.3",
]
docs = [
  "myst-parser>=5.0; python_version >= '3.11'",
  "sphinx>=9.0; python_version >= '3.11'",
  "sphinx-autobuild>=2025.8.25",
  "python-docs-theme>=2026.9.1",
  # alternative theme:
  "furo>=2025.12.19",
]
[tool.uv.sources]
users = { workspace = true }
substances = { workspace = true }
analyses = { workspace = true }
config = { workspace = true }
multichoice = { workspace = true }


[tool.uv.workspace]
members = [
  "packages/users",
  "packages/substances",
  "packages/analyses",
  "packages/config",
  "packages/multichoice",
  # "packages/",
]

[tool.ruff]
line-length = 120
# Django auto-generates migration files (long lines, no class docstrings);
# keep them out of both lint and format so generated code stays untouched.
extend-exclude = [ "*/migrations/*" ]
lint.select = [
  "B",   # flake8-bugbear
  "D",   # flake8-docstrings
  "C4",  # flake8-comprehensions
  "S",   # flake8-bandit
  "F",   # pyflake
  "E",   # pycodestyle
  "W",   # pycodestyle
  "UP",  # pyupgrade
  "I",   # isort
  "RUF", # ruff specific
]
lint.ignore = [
  "D203", # 1 blank line required before class docstring
  "D212", # Multi-line docstring summary should start at the first line
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D107", # Missing docstring in `__init__`
  "D401", # First line of docstring should be in imperative mood
  "RUF012", # Mutable class-attribute defaults (false positives for Django admin attrs)
]
lint.per-file-ignores."conftest.py" = [ "D100" ]
lint.per-file-ignores."docs/conf.py" = [ "D100" ]
lint.per-file-ignores."setup.py" = [ "D100" ]
lint.per-file-ignores."tests/**/*" = [
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "S101",
  "S106",  # tests legitimately assign short test passwords
  "S311",  # seeded stdlib `random.Random` for deterministic test fixtures, not crypto
]
# Non-cryptographic randomness: lab-sample assignment (not security-relevant).
lint.per-file-ignores."packages/analyses/src/analyses/services/randomize.py" = [ "S311" ]
lint.per-file-ignores."packages/analyses/src/analyses/services/registration.py" = [ "S311" ]
lint.per-file-ignores."packages/analyses/src/analyses/services/retry_analysis.py" = [ "S311" ]
lint.per-file-ignores."packages/*/src/*/tests/**/*" = [
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D200",
  "D205",
  "D400",
  "D415",
  "S101",
]

# Legacy files with pre-existing docstring debt. These ignore the missing-
# docstring (D1xx) and docstring-formatting (D2xx/D4xx) rules only, so that the
# rest of the lint gate stays strict. Remove an entry as the docstrings are
# backfilled.
lint.per-file-ignores."packages/users/src/users/views.py" = [ "D101", "D102" ]
lint.per-file-ignores."packages/users/src/users/forms.py" = [ "D101", "D106", "D205" ]
lint.per-file-ignores."packages/users/src/users/adapters.py" = [ "D101", "D102" ]
lint.per-file-ignores."packages/users/src/users/apps.py" = [ "D101", "D102" ]
lint.per-file-ignores."packages/users/src/users/models.py" = [ "D105", "D106" ]
lint.per-file-ignores."packages/users/src/users/admin.py" = [ "D102" ]
lint.per-file-ignores."packages/users/src/users/templatetags/model_descriptions.py" = [ "D103" ]
lint.per-file-ignores."packages/users/src/users/management/commands/init_barcode.py" = [ "D102" ]
lint.per-file-ignores."packages/analyses/src/analyses/models.py" = [ "D105", "D106" ]
lint.per-file-ignores."packages/multichoice/src/multichoice/models.py" = [ "D105", "D106" ]
lint.per-file-ignores."packages/analyses/src/analyses/admin.py" = [ "D102" ]
lint.per-file-ignores."packages/config/src/config/models.py" = [ "D105", "D106" ]
lint.per-file-ignores."packages/substances/src/substances/models.py" = [ "D105", "D106" ]
lint.per-file-ignores."packages/substances/src/substances/admin.py" = [ "D102" ]
lint.per-file-ignores."packages/substances/src/substances/management/commands/import_catalog.py" = [ "D102" ]

lint.isort.known-first-party = [ "flamecheck", "tests" ]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "flamecheck.settings.test"
# The real test suite lives in the top-level ``tests/`` directory. The per-app
# ``packages/*/src/*/tests/`` trees are leftover template cruft (some import
# django-rest-framework, which this project does not use), so they are excluded
# from collection by pinning ``testpaths`` to the canonical suite.
testpaths = [ "tests" ]
addopts = """\
    -v
    -Wdefault
    --cov=flamecheck
    --cov-report=term-missing
    --cov-report=xml
    """

pythonpath = [ "src" ]

[tool.coverage.run]
branch = true

[tool.coverage.paths]
source = [
  "src",
  ".tox/**/site-packages",
]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_lines = [
    # Have to re-enable the standard pragma
    "pragma: no cover",
    "@overload",
    # Don't complain about missing debug-only code:
    "def __repr__",
    "def __repr__(self):",
    "if self.debug",
    "if TYPE_CHECKING",
    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",
    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",
    # Don't complain about abstract methods, they aren't run:
    "@abstractmethod",
    "@abc.abstractmethod",
]
ignore_errors = true
skip_empty = true
precision = 2
omit = [
    "setup.py",
    # auto-generated by grpcio_tools.protoc
    "*_pb2.py",
    # will be copied to the server, so this source code is never executed
]

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
mypy_path = "src/"
no_implicit_optional = true
show_error_codes = true
warn_unreachable = true
warn_unused_ignores = true
exclude = [
  'docs/.*',
  'setup.py',
]

[[tool.mypy.overrides]]
module = "tests.*"
# allow_untyped_defs = true
ignore_errors = true

[[tool.mypy.overrides]]
module = "docs.*"
ignore_errors = true

[tool.semantic_release]
version_toml = [ "pyproject.toml:project.version" ]
version_variables = [
  "src/flamecheck/__init__.py:__version__",
  "docs/conf.py:release",
  ".gitlab-ci.yml:FLAMECHECK_VERSION",
]
build_command = """
uv lock
git add uv.lock
uv build
"""

[tool.semantic_release.changelog]
exclude_commit_patterns = [
  '''chore(?:\([^)]*?\))?: .+''',
  '''ci(?:\([^)]*?\))?: .+''',
  '''refactor(?:\([^)]*?\))?: .+''',
  '''style(?:\([^)]*?\))?: .+''',
  '''test(?:\([^)]*?\))?: .+''',
  '''build\((?!deps\): .+)''',
  '''Merged? .*''',
  '''Initial [Cc]ommit.*''', # codespell:ignore
]

[tool.semantic_release.changelog.environment]
keep_trailing_newline = true

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.branches.noop]
match = "(?!main$)"
prerelease = true



[tool.semantic_release.remote]
name = "origin"
type = "gitlab"
ignore_token_for_push = false
insecure = false



[tool.semantic_release.publish]
upload_to_vcs_release = false