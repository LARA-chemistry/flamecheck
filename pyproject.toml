[build-system]
requires = ["uv_build>=0.10.0,<=0.12.0"]
build-backend = "uv_build"

[project]
name = "flamecheck"
version = "0.0.0"
description = "A qualitative analysis submission system for students in chemistry."
readme = "README.md"
license = { text = "GNU General Public License v3" }
authors = [
  { name = "mark doerr", email = "mark.doerr@uni-greifswald.de" },
]

maintainers = [
   {name = "mark doerr"},
]

requires-python = "==3.13.*"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]

dependencies = [
  "django>=6.0.1",
  "django-environ>=0.12",
  "django-allauth>=0.65",
  "fido2>=2.0.0",
  "argon2-cffi==25.1.0",
  # "django-crispy-forms>=1.17.0",
  "django-redis>=6.0",
  "django-storages>=1.14",
  "psycopg>=3.2.0",
  "django-filter>=25.1",
  "users",
  "to-dos-app",
  "django-ninja>=1.4",
  "django-ninja-extra==0.30.8",
  "django-cors-headers>=4.7.0",
  "markdown>=3.8",
  "celery>=5.3.0",
  "django-celery-beat>=2.4.0",
  "django-celery-results>=2.4.0",
  "whitenoise>=6.9.0",
]
urls."Bug Tracker" = "https://github.com/markdoerr//issues"
urls.Changelog = "https://github.com/markdoerr//blob/main/CHANGELOG.md"
urls.documentation = "https://.readthedocs.io"
urls.repository = "https://github.com/markdoerr/"

[dependency-groups]
dev = [
  "coverage",
  "pytest>=8,<9",
  "git-changelog>=2.4",
  "dotenv>=0.9",
  "pre-commit>=4.0",
  "python-semantic-release>=9.21",
  "ruff>=0.11.0",
  "pytest-cov>=6,<7",
]
docs = [
  "myst-parser>=0.16; python_version >= '3.11'",
  "sphinx>=8.2; python_version >= '3.11'",
  "sphinx-autobuild>=2024.10.3",
  "python-docs-theme>=2025.5",
  # alternative theme: 
  "furo>=2024.6.0",
]
[tool.uv.sources]
to-dos-app = { workspace = true }
users = { workspace = true }
#  = { workspace = true }


[tool.uv.workspace]
members = [
  "packages/users",
  "packages/to-dos-app",
  # "packages/",
]

[tool.ruff]
line-length = 120
lint.select = [
  "B",   # flake8-bugbear
  "D",   # flake8-docstrings
  "C4",  # flake8-comprehensions
  "S",   # flake8-bandit
  "F",   # pyflake
  "E",   # pycodestyle
  "W",   # pycodestyle
  "UP",  # pyupgrade
  "I",   # isort
  "RUF", # ruff specific
]
lint.ignore = [
  "D203", # 1 blank line required before class docstring
  "D212", # Multi-line docstring summary should start at the first line
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D107", # Missing docstring in `__init__`
  "D401", # First line of docstring should be in imperative mood
]
lint.per-file-ignores."conftest.py" = [ "D100" ]
lint.per-file-ignores."docs/conf.py" = [ "D100" ]
lint.per-file-ignores."setup.py" = [ "D100" ]
lint.per-file-ignores."tests/**/*" = [
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "S101",
]
lint.isort.known-first-party = [ "flamecheck", "tests" ]

[tool.pytest.ini_options]
addopts = """\
    -v
    -Wdefault
    --cov=src/flamecheck
    --cov-report=term-missing
    --cov-report=term
    --cov-report=xml
    --cov=flamecheck
    --cov-report=term
    --cov-report=xml
    """

pythonpath = [ "src" ]

[tool.coverage.run]
branch = true

[tool.coverage.paths]
source = [
  "src",
  ".tox/**/site-packages",
]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_lines = [
    # Have to re-enable the standard pragma
    "pragma: no cover",
    "@overload",
    # Don't complain about missing debug-only code:
    "def __repr__",
    "def __repr__(self):",
    "if self.debug",
    "if TYPE_CHECKING",
    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",
    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",
    # Don't complain about abstract methods, they aren't run:
    "@abstractmethod",
    "@abc.abstractmethod",
]
ignore_errors = true
skip_empty = true
precision = 2
omit = [
    "setup.py",
    # auto-generated by grpcio_tools.protoc
    "*_pb2.py",
    # will be copied to the server, so this source code is never executed
]

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
mypy_path = "src/"
no_implicit_optional = true
show_error_codes = true
warn_unreachable = true
warn_unused_ignores = true
exclude = [
  'docs/.*',
  'setup.py',
]

[[tool.mypy.overrides]]
module = "tests.*"
# allow_untyped_defs = true
ignore_errors = true

[[tool.mypy.overrides]]
module = "docs.*"
ignore_errors = true

[tool.semantic_release]
version_toml = [ "pyproject.toml:project.version" ]
version_variables = [
  "src/flamecheck/__init__.py:__version__",
  "docs/conf.py:release",
]
build_command = """
uv lock
git add uv.lock
uv build
"""

[tool.semantic_release.changelog]
exclude_commit_patterns = [
  '''chore(?:\([^)]*?\))?: .+''',
  '''ci(?:\([^)]*?\))?: .+''',
  '''refactor(?:\([^)]*?\))?: .+''',
  '''style(?:\([^)]*?\))?: .+''',
  '''test(?:\([^)]*?\))?: .+''',
  '''build\((?!deps\): .+)''',
  '''Merged? .*''',
  '''Initial [Cc]ommit.*''', # codespell:ignore
]

[tool.semantic_release.changelog.environment]
keep_trailing_newline = true

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.branches.noop]
match = "(?!main$)"
prerelease = true



[tool.semantic_release.remote]
name = "origin"
type = "gitlab"
ignore_token_for_push = false
insecure = false



[tool.semantic_release.publish]
upload_to_vcs_release = false