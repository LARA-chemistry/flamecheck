# Config file for GitLab CI pipeline
# s. also https://www.hifis.net/workshop-materials/gitlab-ci/episodes/05-remove-redundancies/

# Change pip's cache directory to be inside the project directory since we can
# only cache local items.
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  SOURCE_DIR: "$CI_PROJECT_DIR/src/flamecheck"
  DOCS_DIR: "docs"
  DOCS_SOURCE_DIR: "docs/source"
  DOCS_BUILD_DIR: "docs/_build"
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.10.0"
  # Exact Node.js version used to build the Vue/Vite frontend in CI. Keep in
  # sync with the NODE_VERSION ARG in docker/Dockerfile so the CI build matches
  # the production image build. It must satisfy the NPM_VERSION engine
  # requirement (npm 11 needs node ^20.17.0 || >=22.9.0), so pin a specific
  # 22.x release rather than the bare major.
  NODE_VERSION: "22.23.3"
  # npm version used to install the frontend. Must match the npm that generated
  # frontend/package-lock.json, otherwise `npm ci` can drop rolldown's native
  # (optional) bindings and `vite build` fails (npm/cli#4828).
  NPM_VERSION: "11.19.0"
  BASE_LAYER: "trixie"
  LARA_VERSION: "0.2.108"
  UV_PUBLISH_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"
  UV_PUBLISH_PYPI_URL: "https://upload.pypi.org/legacy/"
  UV_PUBLISH_USERNAME: "gitlab-ci-token"
  UV_PUBLISH_PASSWORD: "${CI_JOB_TOKEN}"

# Pin the uv version so the image (and therefore the cached virtualenv) does
# not drift under a rolling tag. An unpinned image tag silently changes the uv
# version, which invalidates the cached .venv and breaks `uv sync --frozen`.
image: ghcr.io/astral-sh/uv:$UV_VERSION-python${PYTHON_VERSION}-$BASE_LAYER

stages:
  - compliance
  - test
  - build
  - publish_pypi
  - build_and_publish_docs

# =============== Cache configuration =========================================

# Cache both uv cache (downloaded packages) and the virtual environment
# This dramatically speeds up jobs by avoiding re-downloads and re-installations
cache:
  # Include the uv version in BOTH cache keys so a uv version change never
  # restores a package cache or venv built by an incompatible uv (the image tag
  # is now pinned, so this is stable).
  - key:
      files:
        - uv.lock
      prefix: uv-cache-$PYTHON_VERSION-$UV_VERSION
    paths:
      - $UV_CACHE_DIR
    policy: pull-push
  - key:
      files:
        - uv.lock
      prefix: uv-venv-$PYTHON_VERSION-$UV_VERSION
    paths:
      - .venv/
    policy: pull-push
  - key: docker-buildkit
    paths:
    - .buildkit-cache/

before_script:
  - python -V # Print out python version for debugging
  - uv --version # Print out uv version for debugging
  # Reconcile the environment with the lockfile. `uv sync` is idempotent (fast
  # when the venv already matches) but repairs a stale/incomplete cached venv.
  # If a cached uv package store is corrupt or was written by another uv, the
  # first sync can fail - in that case clear the cache and the venv and retry
  # from scratch.
  - |
    set -e
    uv sync --group dev --frozen || {
      echo "!! 'uv sync' failed - clearing cache/venv and retrying from scratch"
      rm -rf .venv "$UV_CACHE_DIR"
      uv sync --group dev --frozen
    }

.parallel_python_jobs:
    parallel:
        matrix:
          # - PYTHON_VERSION: ["3.11", "3.12", "3.13"]
          - PYTHON_VERSION: ["3.13"]

.parallel_build_package_jobs:
  parallel:
    matrix:
      - PACKAGE_DIR: ["."]

# Runs on any branch push (develop, main, feature branches, ...) as well as
# merge requests, triggers and tags. Used by the validation jobs (lint, test,
# build) so that every push - including feature/"patch" branches - is checked.
.run_on_all_branches:
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "trigger"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+.*/

# Runs on any branch push. Used by the docker image build so that a fresh image
# is produced for every patch/feature commit, not just develop/main.
.run_on_any_branch:
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "trigger"

.run_on_main:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "trigger"

.run_on_develop:
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "trigger"

.run_on_develop_or_main:
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "trigger"

.run_on_release_tag:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+.*/

.run_on_manual:
  rules:
    - when: manual

# Jobs: ======================================== Compliance ==================================

linting_formatting:
  stage: compliance
  script:
    - echo "Check linting"
    - uvx ruff check .
    - echo "Check formatting"
    - uvx ruff format --check .
  extends:
    - .run_on_all_branches
    # - .run_on_manual

# Jobs: ======================================== Test =========================================

# add support for parallel jobs with different python versions
test:
  stage: test
  script:
    - python --version
    # The default image (ghcr.io/astral-sh/uv:...) ships Python + uv but NOT
    # Node.js. Install a Node.js runtime here (matching $NODE_VERSION, which is
    # kept in sync with docker/Dockerfile) so the Vue/Vite frontend can be
    # built before the tests run.
    - |
      set -e
      ARCH="$(uname -m)"
      case "$ARCH" in
        x86_64) NODE_ARCH="x64" ;;
        aarch64) NODE_ARCH="arm64" ;;
        *) echo "Unsupported architecture: $ARCH" && exit 1 ;;
      esac
      # NODE_VERSION is a full semver (e.g. 22.23.3), not a bare major.
      curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-${NODE_ARCH}.tar.xz" -o /tmp/node.tar.xz
      tar -xJf /tmp/node.tar.xz -C /opt/
      ln -sf "/opt/node-v${NODE_VERSION}-linux-${NODE_ARCH}/bin/node" /usr/local/bin/node
      ln -sf "/opt/node-v${NODE_VERSION}-linux-${NODE_ARCH}/bin/npm" /usr/local/bin/npm
      ln -sf "/opt/node-v${NODE_VERSION}-linux-${NODE_ARCH}/bin/npx" /usr/local/bin/npx
      # The frontend lockfile was generated with npm 11; align the CI npm so
      # `npm ci` installs rolldown's native bindings consistently (older npm
      # versions mishandle optional deps and can drop the platform binding).
      npm install -g "npm@${NPM_VERSION}"
      node --version
      npm --version
    # Build the Vue/Vite frontend into frontend/dist. This is REQUIRED for the
    # SPA routing tests (tests/test_spa_routing.py): the Django catch-all view
    # (src/flamecheck/urls.py:frontend_index) reads the BUILT frontend/dist/
    # index.html off disk and serves it for client-side routes. Without a
    # prebuilt dist/, the view falls back to a plain-text "frontend has not
    # been built yet" message and the 'id="app"' assertion fails. The
    # production Docker image builds the frontend the same way, so building it
    # here keeps the test environment faithful to production.
    - npm --prefix frontend ci --no-audit --no-fund
    # Guard against the npm optional-deps bug (npm/cli#4828): if `npm ci`
    # dropped rolldown's native binding, do a clean reinstall before building.
    - |
      set -e
      # npm/cli#4828: `npm ci` can drop rolldown's platform binding (an optional
      # dep), which makes `vite build` crash with "Cannot find native binding".
      # If the linux x64 binding is absent, do a clean reinstall before building.
      if ! find frontend/node_modules/@rolldown -name "rolldown-binding.linux-x64-*.node" 2>/dev/null | grep -q .; then
        echo "rolldown native binding missing; reinstalling frontend deps cleanly"
        rm -rf frontend/node_modules frontend/package-lock.json
        npm --prefix frontend install --no-audit --no-fund
      fi
    - npm --prefix frontend run build
    # Run the canonical test suite (pyproject.toml configures pytest to collect
    # from tests/ and emit the Cobertura coverage report referenced below).
    - uv run pytest
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  extends:
    #- .run_on_all_branches
    #- .run_on_manual
    - .parallel_python_jobs

# Jobs: ======================================== Build ========================================

build-packages:
  stage: build
  script:
    - echo "Build package $PACKAGE_DIR"
    - cd $PACKAGE_DIR
    - uv build --out-dir dist
    - ls -l dist/
  artifacts:
    paths:
      - "$PACKAGE_DIR/dist/"
    expire_in: 1 week
  extends:
    - .run_on_all_branches
    - .parallel_build_package_jobs

# --- docker ----
#
# Builds and pushes BOTH the development and production images to the GitLab
# container registry. It is activated for every "patch" pipeline — i.e. the
# develop branch, the main branch and any merge request (see
# `.run_on_develop_or_main`) — so the image is always rebuilt when code lands.
# Images are tagged with the short commit SHA, the semantic (LARA) version and
# `latest` (production) / `dev-latest` (development).

docker-build:
  # Official docker image.
  image: docker:latest
  stage: build
  services:
    - docker:dind
  variables:
    # Enable BuildKit for faster builds and cache mounts
    DOCKER_BUILDKIT: 1
    BUILDKIT_INLINE_CACHE: 1
    BUILDKIT_PROGRESS: "plain"
    # Use TLS https://docs.gitlab.com/ee/ci/docker/using_docker_build.html#tls-enabled
    #DOCKER_HOST: tcp://docker:2376
    #DOCKER_TLS_CERTDIR: "/certs"
    #CONTAINER_TEST_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
    DOCKER_BUILD: $CI_REGISTRY_IMAGE/flamecheck-build:latest
    CONTAINER_RELEASE_IMAGE: $CI_REGISTRY_IMAGE/flamecheck:${CI_COMMIT_SHORT_SHA}
    CONTAINER_RELEASE_IMAGE_DEV: $CI_REGISTRY_IMAGE/flamecheck-dev:${CI_COMMIT_SHORT_SHA}
    CONTAINER_RELEASE_IMAGE_LATEST: $CI_REGISTRY_IMAGE/flamecheck:latest
    CONTAINER_RELEASE_IMAGE_DEV_LATEST: $CI_REGISTRY_IMAGE/flamecheck-dev:latest

  before_script:
    - echo "$CI_JOB_TOKEN" | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
    # Create and use buildx builder for cache export support
    - docker buildx create --use --driver docker-container --name ci-builder || true
    - docker buildx inspect --bootstrap
  script:
    # Production image (gunicorn + production settings + built frontend).
    - |
      docker buildx build --push \
        -f docker/Dockerfile \
        --cache-from type=registry,ref=$CI_REGISTRY_IMAGE:cache \
        --cache-to type=registry,ref=$CI_REGISTRY_IMAGE:cache,mode=max \
        -t "$CONTAINER_RELEASE_IMAGE" \
        -t "$CI_REGISTRY_IMAGE/flamecheck:${LARA_VERSION}" \
        -t "$CONTAINER_RELEASE_IMAGE_LATEST" \
        .
    # Development image (runserver + dev settings + dev tools + built frontend).
    - |
      docker buildx build --push \
        -f docker/Dockerfile.dev \
        --cache-from type=registry,ref=$CI_REGISTRY_IMAGE:cache \
        --cache-to type=registry,ref=$CI_REGISTRY_IMAGE:cache,mode=max \
        -t "$CONTAINER_RELEASE_IMAGE_DEV" \
        -t "$CI_REGISTRY_IMAGE/flamecheck-dev:${LARA_VERSION}" \
        -t "$CONTAINER_RELEASE_IMAGE_DEV_LATEST" \
        .
    # buildx --push already pushes all tags, so no separate push commands needed.
  extends:
    # - .run_on_any_branch
    - .run_on_develop_or_main

# Jobs: =================================== Publish to PyPI ================================

# GitLab Package Registry
release-gitlab:
  stage: publish_pypi
  dependencies:
    - build-packages
  script:
    - echo "Publishing $PACKAGE_DIR to GitLab Package Registry"
    - cd $PACKAGE_DIR
    - uv publish dist/*
  # DISABLED: publish to the GitLab Package Registry is turned off for now.
  # The job-level `rules` overrides the ones inherited from `.run_on_develop_or_main`,
  # so this job never runs. To re-enable, delete the `when: never` line below.
  rules:
    - when: never
  extends:
    # - .run_on_release_tag
    - .run_on_develop_or_main
    - .parallel_build_package_jobs

# TestPyPI 
release-testpypi:
  stage: publish_pypi
  dependencies:
    - build-packages
  id_tokens:
    TESTPYPI_ID_TOKEN:
      # Use "testpypi" if uploading to TestPyPI, else use "pypi"
      aud: testpypi
  script:
    - echo "Publishing packages to TestPyPI"
    - cd $PACKAGE_DIR
    # - uv publish --publish-url "https://test.pypi.org/legacy/" --token "$TEST_PYPI_TOKEN" dist/*
    - uvx twine upload --verbose --repository testpypi ./dist/*
  # DISABLED: TestPyPI upload is turned off for now. The job-level `rules`
  # overrides `.run_on_release_tag`, so this job never runs. To re-enable,
  # delete the `when: never` line below.
  rules:
    - when: never
  extends:
    - .run_on_release_tag
    - .parallel_build_package_jobs

# PyPI Production
release-pypi:
  stage: publish_pypi
  dependencies:
    - build-packages
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  script:
    - echo "Publishing $PACKAGE_DIR to PyPI"
    - cd $PACKAGE_DIR
    # - uv publish --token "$PYPI_TOKEN" dist/*
    - uvx twine upload ./dist/*
  # DISABLED: PyPI production upload is turned off for now. `when: never`
  # unconditionally skips this job (it replaces the branch rules below, which
  # are kept commented for reference). To re-enable, delete the `when: never`
  # line and restore the branch rules.
  rules:
    - when: never
    # - if: $CI_COMMIT_BRANCH == "develop"
    # - if: $CI_COMMIT_BRANCH == "main"
    # - if: $CI_PIPELINE_SOURCE == "trigger"
  extends:
    - .parallel_build_package_jobs

# Jobs: =================================== Build and Publish Docs ==========================

pages:
  stage: build_and_publish_docs
  dependencies:
    - build-packages
  script:
    - uv sync --group docs --frozen
    - uv pip install ./dist/*.whl
    - uv run sphinx-apidoc -e -P -o $DOCS_SOURCE_DIR $SOURCE_DIR
    - uv run sphinx-build -b html $DOCS_DIR $DOCS_BUILD_DIR
    - mv $DOCS_BUILD_DIR public
    - uv cache prune --ci
  artifacts:
    paths:
      - public
    expire_in: 1 week
  extends:
    - .run_on_main