# Build the Python package (wheel + sdist) with uv and upload it as an
# artifact. Publishing happens in the release job (ci.yml) / GitLab pipeline;
# this workflow only builds and attaches the distributions.
name: Python Package Build

on:
  push:
    branches:
      - main
      - develop
    tags:
      - v*
  pull_request:

env:
  PACKAGE_VERSION: 0.0.0
  PACKAGE_NAME: flamecheck-${{ env.PACKAGE_VERSION }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Build package
        run: |
          echo "Building python package ..."
          ls -Al
          uv build --out-dir dist
          ls -Al dist
      # Generate hashes used for provenance.
      - name: Generate hash
        id: hash
        run: |
          echo "Generating hash ..."
          ls -Al dist
          (cd dist && echo "hash=$(sha256sum * | base64 -w0)" >> "$GITHUB_OUTPUT")
      - uses: actions/upload-artifact@v4
        with:
          path: dist/
          name: ${{ env.PACKAGE_NAME }}
