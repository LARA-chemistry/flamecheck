# Deploy the Sphinx documentation to GitHub Pages.
#
# Note: this project is hosted on GitLab, where docs are published by the
# `pages` job in .gitlab-ci.yml. This GitHub workflow is provided for
# completeness in case the repository is mirrored to GitHub; it builds the
# Sphinx docs (using the "docs" dependency group) and deploys them to Pages.
name: Deploy docs to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ "{{" }} steps.deployment.outputs.page_url {{ "}}" }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Install doc dependencies
        run: uv sync --group docs --frozen
      - name: Build docs (Sphinx HTML)
        run: |
          uv run sphinx-apidoc -e -P -o docs/source src/flamecheck
          uv run sphinx-build -b html docs docs/_build/html
          ls -Al docs/_build/html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
