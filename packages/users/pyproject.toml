[project]
name = "users"
version = "0.0.0"
description = "User model, barcodes and JWT auth for the FlameCheck submission system"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "mark doerr", email = "mark.doerr@uni-greifswald.de" },
]

requires-python = "==3.13.*"
# factory-boy is a runtime dependency (not just dev) because this package ships
# `users/factory.py`, imported by the `seed_demo` command at container boot.
# The production image is built with `uv sync --no-dev`, so it must be a real
# dependency here or `seed_demo` crashes with "No module named 'factory'".
dependencies = [
  "factory-boy>=3.3.3",
]

[build-system]
requires = ["uv_build>=0.7.13,<0.8.0"]
build-backend = "uv_build"

[tool.uv]
package = true
