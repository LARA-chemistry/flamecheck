{% extends '{{package_name}}/base.html' %}

{% block toolbar %}
<div class="mb-3 flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 pb-2 pt-3">
    <h1 class="text-2xl font-semibold"> {{ section_title }} </h1>
    <div class="flex items-center gap-2">
        <div class="mr-2 flex items-center gap-2">
            <a href="{% url delete_link  object.pk %}" class="inline-flex items-center rounded-md bg-red-600 px-3 py-2 text-sm font-medium text-white hover:bg-red-700" role="button">Delete Item</a>

        </div>
    </div>
</div>
{% endblock %}

{% load crispy_forms_tags %}

{% block content %}
<div class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
    <div class="bg-white shadow overflow-hidden sm:rounded-lg">
        <div class="px-4 py-5 sm:px-6">
            <h3 class="text-lg leading-6 font-medium text-gray-900">{{ section_title }}</h3>
        </div>
        <div class="border-t border-gray-200 bg-gray-50 px-4 py-5  sm:gap-4 sm:px-6">
            <form method="post" class="space-y-6">
                {% csrf_token %}
                {% crispy form %}
            </form>
        </div>
    </div>
</div>
{% endblock %}
