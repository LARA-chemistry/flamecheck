{% extends '{{package_name}}/base.html' %}


{% block toolbar %}
<div class="mb-3 flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 pb-2 pt-3">
  <h1 class="text-2xl font-semibold"> {{ section_title }} </h1>
  <div class="flex items-center gap-2">
    <div class="mr-2 flex items-center gap-2">
      <a href="{% url delete_link  object.pk %}" class="inline-flex items-center rounded-md bg-red-600 px-3 py-2 text-sm font-medium text-white hover:bg-red-700" role="button">Edit Item</a>

    </div>
  </div>
</div>
{% endblock %}

{% load crispy_forms_tags %}

{% block content %}

<form method="post">
  <div>
    {% csrf_token %}
    <p>Are you sure you want to delete "{{ object }}"?</p>
    <input type="submit" value="Confirm" />
  </div>
</form>

{% endblock %}
